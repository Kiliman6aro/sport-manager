name: Build and Release

on:
  push:
    branches:
      - master
      - workout-java8-supports

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Сборка и установка базовой версии workout с тестами
      - name: Build and install base library with tests
        run: mvn clean install -pl workout -am

      # Тесты для базовой версии (опционально, если нужны отдельно)
      - name: Run tests for base library
        run: mvn test -pl workout

      # Сборка и тесты для Android
      - name: Build library for Android with tests
        run: mvn clean test package -pl workout -P android

      - name: Move Android JAR to safe location
        run: |
          mkdir -p artifacts
          move workout/target/workout-1.0-SNAPSHOT-android.jar artifacts/
        shell: pwsh

      # Сборка и тесты для JavaFX
      - name: Build library for JavaFX with tests
        run: mvn clean test package -pl workout -P javafx

      - name: Move JavaFX JAR to safe location
        run: |
          move workout/target/workout-1.0-SNAPSHOT-javafx.jar artifacts/
        shell: pwsh

      # Сборка приложения
      - name: Build JavaFX app
        run: mvn clean package -pl workout-app

      # Упаковка приложения с jpackage
      - name: Package app with jpackage
        run: |
          jpackage --name WorkoutUpApp `
            --input workout-app/target/libs `
            --main-jar workout-app-1.0-SNAPSHOT.jar `
            --main-class ua.pp.hophey.apps.workoutapp.PushUpTrackerApplication `
            --type app-image `
            --dest workout-app/target/dist `
            --module-path "${env:JAVA_HOME}/jmods;workout-app/target/libs" `
            --add-modules javafx.controls,javafx.fxml,javafx.media `
            --win-console `
            --verbose
        shell: pwsh

      - name: Archive app-image
        run: |
          Compress-Archive -Path workout-app/target/dist/WorkoutUpApp -DestinationPath artifacts/WorkoutUpApp.zip
        shell: pwsh

      - name: Upload Android JAR
        uses: actions/upload-artifact@v4
        with:
          name: workout-android
          path: artifacts/workout-1.0-SNAPSHOT-android.jar
          if-no-files-found: error

      - name: Upload JavaFX JAR
        uses: actions/upload-artifact@v4
        with:
          name: workout-javafx
          path: artifacts/workout-1.0-SNAPSHOT-javafx.jar
          if-no-files-found: error

      - name: Upload App ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutUpApp
          path: artifacts/WorkoutUpApp.zip
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android JAR
        uses: actions/download-artifact@v4
        with:
          name: workout-android
          path: artifacts/

      - name: Download JavaFX JAR
        uses: actions/download-artifact@v4
        with:
          name: workout-javafx
          path: artifacts/

      - name: Download App ZIP
        uses: actions/download-artifact@v4
        with:
          name: WorkoutUpApp
          path: artifacts/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Android JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/workout-1.0-SNAPSHOT-android.jar
          asset_name: workout-1.0-SNAPSHOT-android.jar
          asset_content_type: application/java-archive

      - name: Upload JavaFX JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/workout-1.0-SNAPSHOT-javafx.jar
          asset_name: workout-1.0-SNAPSHOT-javafx.jar
          asset_content_type: application/java-archive

      - name: Upload App ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/WorkoutUpApp.zip
          asset_name: WorkoutUpApp.zip
          asset_content_type: application/zip